			manifest.json provides metadata used when your web app is installed on a

			Notice the use of %BASE_URL% in the tags above.

			Unlike "/favicon.ico" or "favicon.ico", "%BASE_URL%favicon.ico" works
			with client-side routing and a non-root deployment path.
			Configure a non-root base path in vite.config.mjs.
		-->

	</head>

	</body>
